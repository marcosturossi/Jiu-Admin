<div class="select-academy-page">
  <div class="select-academy-card">
    <div class="academy-logo-wrapper">
      <img src="assets/company/carlson_logo.png" alt="Carlson Gracie" class="academy-logo" />
    </div>

    <h1 class="academy-title">Sistema de Administração</h1>
    <p class="academy-subtitle">Digite o slug da sua academia para continuar</p>

    @if (errorMsg()) {
      <div class="alert alert-danger py-2 mb-3" role="alert">{{ errorMsg() }}</div>
    }

    <form class="academy-form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="slug" class="form-label fw-semibold">Slug da Academia</label>
        <input
          id="slug"
          type="text"
          class="form-control"
          placeholder="ex: carlson-gracie-sp"
          [value]="slug()"
          (input)="slug.set($any($event.target).value)"
          [disabled]="isLoading()"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 mt-2"
        [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Carregando...
        } @else {
          Continuar <i class="bi bi-arrow-right ms-1"></i>
        }
      </button>
    </form>
  </div>
</div>
