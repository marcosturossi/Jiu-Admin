<section class="page-section">
  <div class="page-toolbar">
    <p-button label="Nova Graduação" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="items()?.items ?? []" [loading]="isLoading()"
           styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{'min-width': '50rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>Aluno</th>
        <th>Data Graduação</th>
        <th>Faixa</th>
        <th>Ordem</th>
        <th>Para Crianças</th>
        <th class="text-center" style="width:8rem">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-graduation>
      <tr>
        <td>{{ graduation.student?.firstName }} {{ graduation.student?.lastName }}</td>
        <td>{{ graduation.graduationDate | date:'dd/MM/yyyy' }}</td>
        <td><p-tag [value]="graduation.belt?.color ?? ''" /></td>
        <td>{{ graduation.belt?.orderIndex }}</td>
        <td>
          <p-tag [value]="graduation.belt?.isForKids ? 'Crianças' : 'Adultos'"
                 [severity]="graduation.belt?.isForKids ? 'success' : 'warn'" />
        </td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" severity="info" size="small" (onClick)="openEdit(graduation)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="delete(graduation)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td [colSpan]="6" class="text-center py-5 text-muted">Nenhum registro.</td></tr>
    </ng-template>
  </p-table>

  <app-pagination [currentPage]="currentPage()" [totalPages]="items()?.totalPages ?? 1"
    [pageSize]="pageSize()" [totalItems]="items()?.totalCount ?? 0"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" />

  <p-dialog [visible]="openedCreate()" (visibleChange)="openedCreate.set($event)"
    header="Nova Graduação" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-30rem">
    <app-create-graduation (closeEvent)="openedCreate.set(false)" (graduationCreated)="onCreated()" />
  </p-dialog>

  <p-dialog [visible]="openedUpdate()" (visibleChange)="openedUpdate.set($event)"
    header="Editar Graduação" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-30rem">
    @if (selected()) {
      <app-update-graduation [graduation]="selected()!" (closeEvent)="openedUpdate.set(false)" (graduationUpdated)="onUpdated()" />
    }
  </p-dialog>
</section>
