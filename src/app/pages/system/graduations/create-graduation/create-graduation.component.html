<form [formGroup]="form">
  <div class="mb-3">
    <label for="studentId" class="form-label">Aluno <span class="text-danger">*</span></label>
    <app-search-select
      inputId="studentId"
      [options]="studentOptions()"
      [selected]="selectedStudent()"
      placeholder="Selecione um aluno"
      label="Aluno"
      (selectionChange)="onStudentSelected($event)"
      (searchChange)="onStudentSearch($event)" />
    <app-field-error [control]="form.get('studentId')" />
  </div>
  <div class="mb-3">
    <label for="beltId" class="form-label">Faixa <span class="text-danger">*</span></label>
    <select class="form-select" id="beltId" formControlName="beltId">
      <option value="" disabled selected>Selecione uma faixa</option>
      @for (opt of belts(); track opt.id) {
        <option [value]="opt.id">{{ opt.color }}</option>
      }
    </select>
    <app-field-error [control]="form.get('beltId')" />
  </div>
  <div class="mb-3">
    <label for="graduationDate" class="form-label">Data <span class="text-danger">*</span></label>
    <input type="date" class="form-control" id="graduationDate" formControlName="graduationDate" />
    <app-field-error [control]="form.get('graduationDate')" />
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
