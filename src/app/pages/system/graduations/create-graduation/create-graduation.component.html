<form [formGroup]="form" class="dialog-form">
  <div class="field">
    <label for="studentId">Aluno *</label>
    <p-select [options]="studentOptions()" formControlName="studentId"
      optionLabel="label" optionValue="id" placeholder="Selecione um aluno" class="w-full" />
  </div>
  <div class="field">
    <label for="beltId">Faixa *</label>
    <p-select [options]="belts()" formControlName="beltId"
      optionLabel="color" optionValue="id" placeholder="Selecione uma faixa" class="w-full" />
  </div>
  <div class="field">
    <label for="graduationDate">Data *</label>
    <input pInputText type="date" id="graduationDate" formControlName="graduationDate" class="w-full" />
  </div>
  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" />
  </div>
</form>
