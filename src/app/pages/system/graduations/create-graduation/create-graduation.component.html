<form [formGroup]="form">
  <div class="mb-3">
    <label for="studentId" class="form-label">Aluno *</label>
    <select class="form-select" id="studentId" formControlName="studentId">
      <option value="" disabled selected>Selecione um aluno</option>
      @for (opt of studentOptions(); track opt.id) {
        <option [value]="opt.id">{{ opt.label }}</option>
      }
    </select>
  </div>
  <div class="mb-3">
    <label for="beltId" class="form-label">Faixa *</label>
    <select class="form-select" id="beltId" formControlName="beltId">
      <option value="" disabled selected>Selecione uma faixa</option>
      @for (opt of belts(); track opt.id) {
        <option [value]="opt.id">{{ opt.color }}</option>
      }
    </select>
  </div>
  <div class="mb-3">
    <label for="graduationDate" class="form-label">Data *</label>
    <input type="date" class="form-control" id="graduationDate" formControlName="graduationDate" />
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
