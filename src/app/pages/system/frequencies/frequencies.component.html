<section class="page-section">
  <div class="page-toolbar">
    <p-button label="Nova Frequência" icon="pi pi-check-square" (onClick)="openCreate()" />
  </div>

  <p-table [value]="items()?.items ?? []" [loading]="isLoading()"
           styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{'min-width':'40rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>Aluno</th>
        <th>Aula</th>
        <th>Data de Criação</th>
        <th class="text-center" style="width:8rem">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-frequency>
      <tr>
        <td><strong>{{ frequency.studentName }}</strong></td>
        <td>{{ frequency.lessonTitle }}</td>
        <td>{{ frequency.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" severity="info" size="small" (onClick)="openEdit(frequency)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="deleteFrequency(frequency)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td [colSpan]="4" class="text-center py-5 text-muted">Nenhuma frequência encontrada.</td></tr>
    </ng-template>
  </p-table>

  <app-pagination [currentPage]="currentPage()" [totalPages]="items()?.totalPages ?? 1"
    [pageSize]="pageSize()" [totalItems]="items()?.totalCount ?? 0"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" />

  <p-dialog [visible]="openedCreate()" (visibleChange)="openedCreate.set($event)"
    header="Nova Frequência" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-50rem">
    <app-create-frequency (closeEvent)="openedCreate.set(false)" (frequencyCreated)="onCreated()" />
  </p-dialog>

  <p-dialog [visible]="openedUpdate()" (visibleChange)="openedUpdate.set($event)"
    header="Editar Frequência" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-30rem">
    @if (selected()) {
      <app-update-frequency [frequency]="selected()!" (closeEvent)="openedUpdate.set(false)" (frequencyUpdated)="onUpdated()" />
    }
  </p-dialog>
</section>
