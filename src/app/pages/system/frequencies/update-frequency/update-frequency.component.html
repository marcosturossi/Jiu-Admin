<form [formGroup]="frequencyForm" class="dialog-form">
  <div class="field">
    <label for="studentSelect">Selecione o Aluno *</label>
    <p-select
      id="studentSelect"
      [options]="studentOptions()"
      formControlName="studentId"
      optionLabel="label"
      optionValue="value"
      placeholder="Selecione um aluno..."
      class="w-full" />
  </div>
  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="update()" [disabled]="frequencyForm.invalid" />
  </div>
</form>
