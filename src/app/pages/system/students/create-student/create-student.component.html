<form [formGroup]="form" class="dialog-form">
  <div class="field">
    <label for="userName">Usuário *</label>
    <input pInputText id="userName" formControlName="userName" placeholder="Digite o nome de usuário" class="w-full" />
  </div>
  <div class="field">
    <label for="email">E-mail *</label>
    <input pInputText id="email" formControlName="email" placeholder="Digite o e-mail" type="email" class="w-full" />
  </div>
  <div class="field">
    <label for="phoneNumber">Telefone</label>
    <input pInputText id="phoneNumber" formControlName="phoneNumber" placeholder="Digite o telefone" class="w-full" />
  </div>
  <div class="field">
    <label for="firstName">Nome</label>
    <input pInputText id="firstName" formControlName="firstName" placeholder="Digite o primeiro nome" class="w-full" />
  </div>
  <div class="field">
    <label for="lastName">Sobrenome</label>
    <input pInputText id="lastName" formControlName="lastName" placeholder="Digite o sobrenome" class="w-full" />
  </div>
  <div class="field">
    <label for="birthDay">Data de Nascimento</label>
    <p-datepicker formControlName="birthDay" dateFormat="yy-mm-dd" [showIcon]="true" class="w-full" inputId="birthDay" />
  </div>
  <div class="field flex-row gap-2 align-items-center">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
    <label for="isActive">Ativo</label>
  </div>
  <div class="field">
    <label for="preferredUsername">Usuário Preferido</label>
    <input pInputText id="preferredUsername" formControlName="preferredUsername" placeholder="Digite o usuário preferido" class="w-full" />
  </div>
  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" />
  </div>
</form>
