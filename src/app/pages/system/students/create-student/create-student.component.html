<form [formGroup]="form">
  <div class="mb-3">
    <label for="userName">Usuário *</label>
    <input type="text" class="form-control" id="userName" formControlName="userName" placeholder="Digite o nome de usuário" />
  </div>
  <div class="mb-3">
    <label for="email">E-mail *</label>
    <input type="email" class="form-control" id="email" formControlName="email" placeholder="Digite o e-mail" />
  </div>
  <div class="mb-3">
    <label for="phoneNumber">Telefone</label>
    <input type="text" class="form-control" id="phoneNumber" formControlName="phoneNumber" placeholder="Digite o telefone" />
  </div>
  <div class="mb-3">
    <label for="firstName">Nome</label>
    <input type="text" class="form-control" id="firstName" formControlName="firstName" placeholder="Digite o primeiro nome" />
  </div>
  <div class="mb-3">
    <label for="lastName">Sobrenome</label>
    <input type="text" class="form-control" id="lastName" formControlName="lastName" placeholder="Digite o sobrenome" />
  </div>
    <div class="mb-3">
    <label for="cpf">CPF</label>
    <input type="text" class="form-control" id="cpf" formControlName="cpf" placeholder="Digite o CPF" />
  </div>
  <div class="mb-3">
    <label for="birthDay">Data de Nascimento</label>
    <input type="date" class="form-control" id="birthDay" formControlName="birthDay" />
  </div>

  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive" />
    <label class="form-check-label" for="isActive">Ativo</label>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
