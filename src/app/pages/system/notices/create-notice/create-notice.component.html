<form [formGroup]="form">
  <div class="mb-3">
    <label for="description" class="form-label">Descrição <span class="text-danger">*</span></label>
    <textarea id="description" formControlName="description" placeholder="Digite a descrição do aviso"
      rows="4" class="form-control" style="resize: vertical;"></textarea>
    <app-field-error [control]="form.get('description')" />
  </div>
  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" formControlName="isActive" id="isActive" />
    <label class="form-check-label" for="isActive">Ativo</label>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
