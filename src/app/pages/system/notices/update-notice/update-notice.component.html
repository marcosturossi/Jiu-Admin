<form [formGroup]="form" class="dialog-form">
  <div class="field">
    <label for="description">Descrição *</label>
    <textarea pInputText id="description" formControlName="description" placeholder="Digite a descrição do aviso" rows="4" class="w-full" style="resize: vertical;"></textarea>
  </div>
  <div class="field flex-row gap-2 align-items-center">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
    <label for="isActive">Ativo</label>
  </div>
  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" />
  </div>
</form>
