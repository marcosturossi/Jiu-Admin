<section class="page-section">
  <div class="page-toolbar">
    <p-button label="Novo Aviso" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table
    [value]="items()"
    [loading]="isLoading()"
    styleClass="p-datatable-sm p-datatable-striped"
    [tableStyle]="{ 'min-width': '40rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Descrição</th>
        <th>Status</th>
        <th>Data de Criação</th>
        <th class="text-center" style="width: 8rem">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-notice>
      <tr>
        <td>{{ notice.description }}</td>
        <td><p-tag [value]="notice.isActive ? 'Ativo' : 'Inativo'" [severity]="notice.isActive ? 'success' : 'secondary'" /></td>
        <td>{{ notice.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" severity="info" size="small" (onClick)="openEdit(notice)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="delete(notice)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td [colSpan]="4" class="text-center py-5 text-muted">Nenhum registro encontrado.</td></tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="openedCreate()"
    (visibleChange)="openedCreate.set($event)"
    header="Novo Aviso"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="w-full md:w-30rem"
  >
    <app-create-notice (closeEvent)="openedCreate.set(false)" (noticeCreated)="onCreated()" />
  </p-dialog>

  <p-dialog
    [visible]="openedUpdate()"
    (visibleChange)="openedUpdate.set($event)"
    header="Editar Aviso"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="w-full md:w-30rem"
  >
    @if (selected()) {
      <app-update-notice [notice]="selected()!" (closeEvent)="openedUpdate.set(false)" (noticeUpdated)="onUpdated()" />
    }
  </p-dialog>
</section>
