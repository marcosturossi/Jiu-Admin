<form [formGroup]="form" class="dialog-form">
  <div class="form-row">
    <div class="field" style="flex:2">
      <label for="title">Título *</label>
      <input pInputText id="title" formControlName="title" placeholder="Digite o título da notificação" class="w-full" />
    </div>
    <div class="field" style="flex:1">
      <label for="type">Tipo *</label>
      <p-select id="type" [options]="notificationTypes" formControlName="type"
        optionLabel="label" optionValue="value" placeholder="Selecione" class="w-full" />
    </div>
  </div>

  <div class="field">
    <label for="message">Mensagem *</label>
    <textarea pTextarea id="message" formControlName="message" rows="4"
      placeholder="Digite a mensagem da notificação" class="w-full"></textarea>
  </div>

  <div class="form-row">
    <div class="field" style="flex:1">
      <label for="priority">Prioridade</label>
      <p-select id="priority" [options]="notificationPriorities" formControlName="priority"
        optionLabel="label" optionValue="value" placeholder="Selecione" class="w-full" />
    </div>
    <div class="field" style="flex:1">
      <label for="userId">ID do Usuário</label>
      <input pInputText id="userId" formControlName="userId" placeholder="Vazio = todos os usuários" class="w-full" />
      <small class="hint">Deixe vazio para enviar para todos os usuários</small>
    </div>
  </div>

  <div class="form-row">
    <div class="field" style="flex:1">
      <label for="expiresAt">Data de Expiração</label>
      <p-datepicker id="expiresAt" formControlName="expiresAt" [showTime]="true" [showSeconds]="false"
        placeholder="Sem expiração" class="w-full" />
      <small class="hint">Deixe vazio para notificação sem expiração</small>
    </div>
    <div class="field" style="flex:1">
      <label for="actionUrl">URL de Ação</label>
      <input pInputText id="actionUrl" formControlName="actionUrl" placeholder="URL opcional para ação" class="w-full" />
    </div>
  </div>

  <div class="field">
    <label for="metadata">Metadados (JSON)</label>
    <textarea pTextarea id="metadata" formControlName="metadata" rows="2"
      placeholder='{"key": "value"}' class="w-full"></textarea>
    <small class="hint">Dados adicionais em formato JSON (opcional)</small>
  </div>

  <div class="checkbox-row">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActiveCheck" />
    <label for="isActiveCheck">Notificação Ativa</label>
  </div>

  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Atualizar" icon="pi pi-check" (onClick)="update()" [disabled]="form.invalid" />
  </div>
</form>
