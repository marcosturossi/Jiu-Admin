<form [formGroup]="form">
  <div class="row g-2">
    <div class="col mb-3">
      <label for="title" class="form-label">Título <span class="text-danger">*</span></label>
      <input id="title" formControlName="title" placeholder="Digite o título da notificação" class="form-control" />
      <app-field-error [control]="form.get('title')" />
    </div>
    <div class="col mb-3">
      <label for="type" class="form-label">Tipo <span class="text-danger">*</span></label>
      <select id="type" formControlName="type" class="form-select">
        <option value="" disabled>Selecione</option>
        <option value="Info">Informação</option>
        <option value="Success">Sucesso</option>
        <option value="Warning">Aviso</option>
        <option value="Error">Erro</option>
        <option value="Graduation">Graduação</option>
        <option value="Lesson">Aula</option>
        <option value="Payment">Pagamento</option>
        <option value="System">Sistema</option>
      </select>
      <app-field-error [control]="form.get('type')" />
    </div>
  </div>

  <div class="mb-3">
    <label for="message" class="form-label">Mensagem <span class="text-danger">*</span></label>
    <textarea id="message" formControlName="message" rows="4"
      placeholder="Digite a mensagem da notificação" class="form-control"></textarea>
    <app-field-error [control]="form.get('message')" />
  </div>

  <div class="row g-2">
    <div class="col mb-3">
      <label for="userId" class="form-label">ID do Usuário</label>
      <input id="userId" formControlName="userId" placeholder="Vazio = todos os usuários" class="form-control" />
      <small class="text-muted">Deixe vazio para enviar para todos os usuários</small>
    </div>
  </div>

  <div class="row g-2">
    <div class="col mb-3">
      <label for="expiresAt" class="form-label">Data de Expiração</label>
      <input type="datetime-local" id="expiresAt" formControlName="expiresAt" class="form-control" />
      <small class="text-muted">Deixe vazio para notificação sem expiração</small>
    </div>
  </div>

  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" formControlName="isActive" id="isActiveCheck" />
    <label class="form-check-label" for="isActiveCheck">Notificação Ativa</label>
  </div>

  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="update()" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Atualizar
    </button>
  </div>
</form>
