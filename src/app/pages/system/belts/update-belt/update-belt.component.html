<form [formGroup]="form">
  <div class="mb-3">
    <label for="color">Cor da Faixa <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="color" formControlName="color" placeholder="Digite a cor da faixa" />
    <app-field-error [control]="form.get('color')" />
  </div>
  <div class="mb-3">
    <label for="orderIndex">Ordem <span class="text-danger">*</span></label>
    <input type="number" class="form-control" id="orderIndex" formControlName="orderIndex" placeholder="Digite a ordem" />
    <app-field-error [control]="form.get('orderIndex')" />
  </div>
  <div class="mb-3 form-check">
    <input class="form-check-input" type="checkbox" formControlName="isForKids" id="isForKids" />
    <label class="form-check-label" for="isForKids">Para Crianças</label>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
