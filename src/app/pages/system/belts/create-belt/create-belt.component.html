<form [formGroup]="form" class="dialog-form">
  <div class="field">
    <label for="color">Cor da Faixa *</label>
    <input pInputText id="color" formControlName="color" placeholder="Digite a cor da faixa" class="w-full" />
  </div>
  <div class="field">
    <label for="orderIndex">Ordem *</label>
    <input pInputText id="orderIndex" formControlName="orderIndex" placeholder="Digite a ordem" type="number" class="w-full" />
  </div>
  <div class="field flex-row gap-2 align-items-center">
    <p-checkbox formControlName="isForKids" [binary]="true" inputId="isForKids" />
    <label for="isForKids">Para Crianças</label>
  </div>
  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" />
  </div>
</form>
