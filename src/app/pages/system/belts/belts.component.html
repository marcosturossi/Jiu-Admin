<section class="page-section">
  <div class="page-toolbar">
    <p-button label="Nova Faixa" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table
    [value]="items()?.items ?? []"
    [loading]="isLoading()"
    styleClass="p-datatable-sm p-datatable-striped"
    [tableStyle]="{ 'min-width': '40rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Cor</th>
        <th>Ordem</th>
        <th>Para Crianças</th>
        <th class="text-center" style="width: 8rem">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-belt>
      <tr>
        <td>{{ belt.color }}</td>
        <td><p-tag [value]="belt.orderIndex?.toString()" severity="info" /></td>
        <td><p-tag [value]="belt.isForKids ? 'Sim' : 'Não'" [severity]="belt.isForKids ? 'success' : 'warn'" /></td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" severity="info" size="small" (onClick)="openEdit(belt)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="delete(belt)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td [colSpan]="4" class="text-center py-5 text-muted">Nenhum registro encontrado.</td></tr>
    </ng-template>
  </p-table>

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="items()?.totalPages ?? 1"
    [pageSize]="pageSize()"
    [totalItems]="items()?.totalCount ?? 0"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)" />

  <p-dialog
    [visible]="openedCreate()"
    (visibleChange)="openedCreate.set($event)"
    header="Nova Faixa"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="w-full md:w-30rem"
  >
    <app-create-belt (closeEvent)="openedCreate.set(false)" (beltCreated)="onCreated()" />
  </p-dialog>

  <p-dialog
    [visible]="openedUpdate()"
    (visibleChange)="openedUpdate.set($event)"
    header="Editar Faixa"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="w-full md:w-30rem"
  >
    @if (selected()) {
      <app-update-belt [belt]="selected()!" (closeEvent)="openedUpdate.set(false)" (beltUpdated)="onUpdated()" />
    }
  </p-dialog>
</section>
