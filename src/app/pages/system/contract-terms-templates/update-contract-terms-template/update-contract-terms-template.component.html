<form [formGroup]="form">
  <div class="mb-3">
    <label for="name" class="form-label">Nome <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="name" formControlName="name" placeholder="Ex: Plano Padrão" />
    <app-field-error [control]="form.get('name')" />
  </div>
  <div class="mb-3">
    <label for="text" class="form-label">Cláusulas e Termos <span class="text-danger">*</span></label>
    <quill-editor
      id="text"
      formControlName="text"
      format="html"
      [modules]="quillModules"
      [styles]="{ height: '260px' }"
      placeholder="Descreva as cláusulas e termos do contrato de prestação de serviços..."
    />
    <app-field-error [control]="form.get('text')" />
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
