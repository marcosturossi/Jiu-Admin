<form [formGroup]="form">
  <div class="mb-3">
    <label for="beltId" class="form-label">Faixa <span class="text-danger">*</span></label>
    <div class="d-flex gap-2">
      <select id="beltId" formControlName="beltId" class="form-select flex-grow-1">
        <option value="" disabled>Selecione uma faixa</option>
        @for (opt of belts(); track opt.id) {
          <option [value]="opt.id">{{ opt.color }}</option>
        }
      </select>
      <button type="button" class="btn btn-outline-secondary" title="Nova faixa" (click)="openedCreateBelt.set(true)">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
    <app-field-error [control]="form.get('beltId')" />
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Descrição do Requisito <span class="text-danger">*</span></label>
    <textarea id="description" formControlName="description"
      placeholder="Digite a descrição do requisito" rows="3" class="form-control"></textarea>
    <app-field-error [control]="form.get('description')" />
  </div>
  <div class="mb-3">
    <label for="minimumClasses" class="form-label">Número Mínimo de Aulas</label>
    <input type="number" id="minimumClasses" formControlName="minimumClasses"
      placeholder="Digite o número mínimo de aulas" class="form-control" />
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button class="btn btn-outline-secondary" type="button" (click)="close()">Cancelar</button>
    <button class="btn btn-primary" type="button" [disabled]="isSaving() || form.invalid" (click)="save()">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i> Salvar
    </button>
  </div>
</form>

@if (openedCreateBelt()) {
  <div class="modal-backdrop-custom" (click)="openedCreateBelt.set(false)"></div>
  <div class="modal show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nova Faixa</h5>
          <button type="button" class="btn-close" (click)="openedCreateBelt.set(false)" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <app-create-belt
            (closeEvent)="openedCreateBelt.set(false)"
            (beltCreated)="onBeltCreated($event)" />
        </div>
      </div>
    </div>
  </div>
}
