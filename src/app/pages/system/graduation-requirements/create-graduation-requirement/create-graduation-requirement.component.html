<form [formGroup]="form">
  <div class="mb-3">
    <label for="beltId" class="form-label">Faixa *</label>
    <select id="beltId" formControlName="beltId" class="form-select">
      <option value="" disabled>Selecione uma faixa</option>
      @for (opt of belts(); track opt.id) {
        <option [value]="opt.id">{{ opt.color }}</option>
      }
    </select>
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Descrição do Requisito *</label>
    <textarea id="description" formControlName="description"
      placeholder="Digite a descrição do requisito" rows="3" class="form-control"></textarea>
  </div>
  <div class="mb-3">
    <label for="minimumClasses" class="form-label">Número Mínimo de Aulas</label>
    <input type="number" id="minimumClasses" formControlName="minimumClasses"
      placeholder="Digite o número mínimo de aulas" class="form-control" />
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button class="btn btn-outline-secondary" type="button" (click)="close()">Cancelar</button>
    <button class="btn btn-primary" type="button" [disabled]="form.invalid" (click)="save()">
      <i class="bi bi-check-lg me-1"></i> Salvar
    </button>
  </div>
</form>
