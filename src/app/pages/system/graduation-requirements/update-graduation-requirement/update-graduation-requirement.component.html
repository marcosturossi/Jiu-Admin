<form [formGroup]="form" class="dialog-form">
  <div class="field">
    <label for="beltId">Faixa *</label>
    <p-select [options]="belts()" formControlName="beltId"
      optionLabel="color" optionValue="id" placeholder="Selecione uma faixa" class="w-full" />
  </div>
  <div class="field">
    <label for="description">Descrição do Requisito *</label>
    <textarea pTextarea id="description" formControlName="description"
      placeholder="Digite a descrição do requisito" rows="3" class="w-full"></textarea>
  </div>
  <div class="field">
    <label for="minimumClasses">Número Mínimo de Aulas</label>
    <input pInputText type="number" id="minimumClasses" formControlName="minimumClasses"
      placeholder="Digite o número mínimo de aulas" class="w-full" />
  </div>
  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" />
  </div>
</form>
