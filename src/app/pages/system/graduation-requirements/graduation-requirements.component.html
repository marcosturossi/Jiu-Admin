<section class="page-section">
  <div class="page-toolbar">
    <p-button label="Novo Requisito" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="items()" [loading]="isLoading()"
           styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{'min-width': '40rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>Faixa</th>
        <th>Descrição</th>
        <th>Aulas Mínimas</th>
        <th class="text-center" style="width:8rem">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-req>
      <tr>
        <td><p-tag [value]="req.belt?.color ?? 'N/A'" /></td>
        <td>{{ req.description }}</td>
        <td>{{ req.minimumClasses ?? 0 }}</td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" severity="info" size="small" (onClick)="openEdit(req)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="delete(req)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td [colSpan]="4" class="text-center py-5 text-muted">Nenhum registro.</td></tr>
    </ng-template>
  </p-table>

  <p-dialog [visible]="openedCreate()" (visibleChange)="openedCreate.set($event)"
    header="Novo Requisito" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-30rem">
    <app-create-graduation-requirement (closeEvent)="openedCreate.set(false)" (graduationRequirementCreated)="onCreated()" />
  </p-dialog>

  <p-dialog [visible]="openedUpdate()" (visibleChange)="openedUpdate.set($event)"
    header="Editar Requisito" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-30rem">
    @if (selected()) {
      <app-update-graduation-requirement [requirement]="selected()!" (closeEvent)="openedUpdate.set(false)" (graduationRequirementUpdated)="onUpdated()" />
    }
  </p-dialog>
</section>
