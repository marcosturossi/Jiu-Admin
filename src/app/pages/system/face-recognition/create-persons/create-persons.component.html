<form [formGroup]="personForm">
  <div class="mb-3">
    <label for="studentSelect" class="form-label">Aluno <span class="text-danger">*</span></label>
    <app-search-select
      inputId="studentSelect"
      [options]="studentOptions()"
      [selected]="selectedStudent()"
      placeholder="Selecione um aluno..."
      label="Aluno"
      (selectionChange)="onStudentSelected($event)"
      (searchChange)="onStudentSearch($event)" />
    <app-field-error [control]="personForm.get('studentId')" />
  </div>

  <div class="mb-3">
    <label for="imagesInput" class="form-label">Fotos do rosto <span class="text-danger">*</span></label>
    <input type="file" id="imagesInput" class="form-control" accept="image/*" multiple (change)="onFilesSelected($event)" />
    <small class="text-muted">Formatos aceitos: JPG, PNG, GIF. Tamanho máximo: 5MB por imagem. Selecione até 10 fotos.</small>
    <app-field-error [control]="personForm.get('images')" />
  </div>

  @if (previewUrls().length > 0) {
    <div class="preview-section mb-3">
      <span class="form-label d-block">Pré-visualização</span>
      <div class="preview-grid">
        @for (url of previewUrls(); track url) {
          <div class="preview-item">
            <img [src]="url" alt="Preview" class="preview-img" />
          </div>
        }
      </div>
      <button type="button" class="btn btn-sm btn-outline-secondary mt-2" (click)="clearImages()">
        <i class="bi bi-trash me-1"></i>Limpar
      </button>
    </div>
  }

  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="create()" [disabled]="!personForm.valid || isCreating()">
      @if (isCreating()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>{{ isCreating() ? 'Criando...' : 'Criar Pessoa' }}
    </button>
  </div>
</form>
