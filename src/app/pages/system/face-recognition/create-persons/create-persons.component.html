<form [formGroup]="personForm" class="dialog-form">
  <div class="field">
    <label for="studentSelect">Aluno *</label>
    <p-select id="studentSelect" [options]="studentOptions()" formControlName="studentId"
      optionLabel="label" optionValue="value" placeholder="Selecione um aluno..." class="w-full" />
  </div>

  <div class="field">
    <label for="imagesInput">Fotos do rosto *</label>
    <input type="file" id="imagesInput" class="file-input" accept="image/*" multiple (change)="onFilesSelected($event)" />
    <small class="hint">Formatos aceitos: JPG, PNG, GIF. Tamanho máximo: 5MB por imagem. Selecione até 10 fotos.</small>
  </div>

  @if (previewUrls().length > 0) {
    <div class="preview-section">
      <label>Pré-visualização</label>
      <div class="preview-grid">
        @for (url of previewUrls(); track url) {
          <div class="preview-item">
            <img [src]="url" alt="Preview" class="preview-img" />
          </div>
        }
      </div>
      <p-button label="Limpar" icon="pi pi-trash" severity="secondary" [outlined]="true" size="small" (onClick)="clearImages()" />
    </div>
  }

  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button
      [label]="isCreating() ? 'Criando...' : 'Criar Pessoa'"
      icon="pi pi-check"
      [loading]="isCreating()"
      [disabled]="!personForm.valid || isCreating()"
      (onClick)="create()" />
  </div>
</form>
