<form [formGroup]="personForm" class="dialog-form">
  <div class="field">
    <label for="name">Nome *</label>
    <input pInputText id="name" formControlName="name" placeholder="Digite o nome completo" class="w-full" />
  </div>

  @if (existingImages().length > 0) {
    <div class="field">
      <label>Imagens já cadastradas</label>
      <div class="existing-images">
        @for (img of existingImages(); track img.id) {
          <div class="existing-item">
            <img [src]="getImageSrc(img)" alt="Imagem cadastrada" class="existing-thumb" />
            @if (img.is_primary) {
              <span class="primary-label">Principal</span>
            }
            <p-button icon="pi pi-times" [text]="true" severity="danger" size="small"
              (onClick)="removeImage(img)" title="Remover imagem" styleClass="remove-btn" />
          </div>
        }
      </div>
    </div>
  }

  <div class="field">
    <label for="imagesInput">Adicionar novas fotos</label>
    <input type="file" id="imagesInput" class="file-input" accept="image/*" multiple (change)="onFilesSelected($event)" />
    <small class="hint">Formatos aceitos: JPG, PNG, GIF. Tamanho máximo: 5MB por imagem.</small>
  </div>

  @if (selectedFiles().length > 0) {
    <div class="preview-section">
      <label>Pré-visualização das novas fotos</label>
      <div class="preview-grid">
        @for (url of previewUrls(); track url) {
          <div class="preview-item">
            <img [src]="url" alt="Preview" class="preview-img" />
          </div>
        }
      </div>
      <p-button label="Limpar" icon="pi pi-trash" severity="secondary" [outlined]="true" size="small" (onClick)="clearImages()" />
    </div>
  }

  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button
      [label]="isUpdating() ? 'Salvando...' : 'Salvar Alterações'"
      icon="pi pi-check"
      [loading]="isUpdating()"
      [disabled]="!personForm.valid || isUpdating()"
      (onClick)="update()" />
  </div>
</form>
