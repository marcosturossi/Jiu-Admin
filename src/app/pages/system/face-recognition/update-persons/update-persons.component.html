<form [formGroup]="personForm">
  <div class="mb-3">
    <label for="name" class="form-label">Nome *</label>
    <input id="name" formControlName="name" placeholder="Digite o nome completo" class="form-control" />
  </div>

  @if (existingImages().length > 0) {
    <div class="mb-3">
      <label class="form-label">Imagens já cadastradas</label>
      <div class="existing-images">
        @for (img of existingImages(); track img.id) {
          <div class="existing-item">
            <img [src]="getImageSrc(img)" alt="Imagem cadastrada" class="existing-thumb" />
            @if (img.is_primary) {
              <span class="primary-label">Principal</span>
            }
            <button type="button" class="btn btn-sm btn-outline-danger remove-btn" (click)="removeImage(img)" title="Remover imagem">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        }
      </div>
    </div>
  }

  <div class="mb-3">
    <label for="imagesInput" class="form-label">Adicionar novas fotos</label>
    <input type="file" id="imagesInput" class="form-control" accept="image/*" multiple (change)="onFilesSelected($event)" />
    <small class="text-muted">Formatos aceitos: JPG, PNG, GIF. Tamanho máximo: 5MB por imagem.</small>
  </div>

  @if (selectedFiles().length > 0) {
    <div class="preview-section mb-3">
      <label class="form-label">Pré-visualização das novas fotos</label>
      <div class="preview-grid">
        @for (url of previewUrls(); track url) {
          <div class="preview-item">
            <img [src]="url" alt="Preview" class="preview-img" />
          </div>
        }
      </div>
      <button type="button" class="btn btn-sm btn-outline-secondary mt-2" (click)="clearImages()">
        <i class="bi bi-trash me-1"></i>Limpar
      </button>
    </div>
  }

  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="update()" [disabled]="!personForm.valid || isUpdating()">
      @if (isUpdating()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>{{ isUpdating() ? 'Salvando...' : 'Salvar Alterações' }}
    </button>
  </div>
</form>
