<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label>Aluno *</label>
    <select class="form-select" formControlName="studentId">
      <option value="" disabled>Selecione o aluno</option>
      @for (opt of studentOptions(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  </div>
  <div class="mb-3">
    <label>Plano de Pagamento *</label>
    <select class="form-select" formControlName="feePlanId">
      <option value="" disabled>Selecione o plano</option>
      @for (opt of feePlanOptions(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  </div>
  <div class="mb-3">
    <label>Data de Início *</label>
    <input type="date" class="form-control" formControlName="startDate" />
  </div>
  <div class="mb-3">
    <label>Observações</label>
    <textarea class="form-control" formControlName="notes" rows="3" placeholder="Observações opcionais"></textarea>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
      @if (isSaving()) {
        <span class="spinner-border spinner-border-sm me-1" role="status"></span>
      }
      <i class="bi bi-check-lg me-1"></i>Criar Contrato
    </button>
  </div>
</form>
