<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label for="status">Status <span class="text-danger">*</span></label>
    <select id="status" class="form-select" formControlName="status">
      @for (opt of statusOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <app-field-error [control]="form.get('status')" />
  </div>
  <div class="mb-3">
    <label for="notes">Observações</label>
    <textarea id="notes" class="form-control" formControlName="notes" rows="3" placeholder="Observações"></textarea>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
      @if (isSaving()) {
        <span class="spinner-border spinner-border-sm me-1" role="status"></span>
      }
      <i class="bi bi-check-lg me-1"></i>Atualizar
    </button>
  </div>
</form>
