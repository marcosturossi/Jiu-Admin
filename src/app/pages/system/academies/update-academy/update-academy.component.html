<form [formGroup]="form" class="dialog-form">
  <div class="field">
    <label for="name">Nome da Academia *</label>
    <input
      pInputText
      id="name"
      formControlName="name"
      placeholder="Ex: Carlson Gracie São Paulo"
      class="w-full"
    />
    @if (form.get('name')?.invalid && form.get('name')?.touched) {
      <small class="text-danger">Nome é obrigatório.</small>
    }
  </div>

  <div class="field flex-row gap-2 align-items-center">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
    <label for="isActive">Ativa</label>
  </div>

  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" />
  </div>
</form>
