<form [formGroup]="form">
  <div class="mb-3">
    <label for="name">Nome da Academia *</label>
    <input
      type="text"
      class="form-control"
      id="name"
      formControlName="name"
      placeholder="Ex: Carlson Gracie São Paulo"
    />
    @if (form.get('name')?.invalid && form.get('name')?.touched) {
      <small class="text-danger">Nome é obrigatório.</small>
    }
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="cnpj">CNPJ</label>
      <input type="text" class="form-control" id="cnpj" formControlName="cnpj" placeholder="00.000.000/0000-00" />
    </div>

    <div class="col-md-6 mb-3">
      <label for="email">E-mail de Contato</label>
      <input type="email" class="form-control" id="email" formControlName="email" placeholder="contato@academia.com" />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <small class="text-danger">E-mail inválido.</small>
      }
    </div>
  </div>

  <hr class="my-3" />
  <p class="mb-2"><strong>Endereço</strong></p>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="zipCode">CEP</label>
      <input type="text" class="form-control" id="zipCode" formControlName="zipCode" placeholder="00000-000" (blur)="onZipCodeChange()" />
    </div>

    <div class="col-md-8 mb-3">
      <label for="street">Rua</label>
      <input type="text" class="form-control" id="street" formControlName="street" />
    </div>

    <div class="col-md-4 mb-3">
      <label for="number">Número</label>
      <input type="text" class="form-control" id="number" formControlName="number" />
    </div>

    <div class="col-md-8 mb-3">
      <label for="complement">Complemento</label>
      <input type="text" class="form-control" id="complement" formControlName="complement" />
    </div>

    <div class="col-md-5 mb-3">
      <label for="neighborhood">Bairro</label>
      <input type="text" class="form-control" id="neighborhood" formControlName="neighborhood" />
    </div>

    <div class="col-md-5 mb-3">
      <label for="city">Cidade</label>
      <input type="text" class="form-control" id="city" formControlName="city" />
    </div>

    <div class="col-md-2 mb-3">
      <label for="state">UF</label>
      <input type="text" class="form-control" id="state" formControlName="state" maxlength="2" />
    </div>
  </div>

  <div class="mb-3 form-check">
    <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive" />
    <label class="form-check-label" for="isActive">Ativa</label>
  </div>

  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
