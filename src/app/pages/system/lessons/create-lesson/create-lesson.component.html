<form [formGroup]="form">
  <div class="mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="generate-title"
        [ngModel]="autoTitle()" [ngModelOptions]="{standalone: true}"
        (ngModelChange)="onAutoTitleChange($event)" />
      <label class="form-check-label" for="generate-title">Gerar Título Automático</label>
    </div>
  </div>
  <div class="mb-3">
    <label for="title" class="form-label">Título <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="title" formControlName="title" placeholder="Título da aula" />
    <app-field-error [control]="form.get('title')" />
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Descrição</label>
    <textarea class="form-control" id="description" formControlName="description"
      placeholder="Descrição da aula" rows="3"></textarea>
  </div>
  <div class="mb-3">
    <label for="scheduledDate" class="form-label">Data e Hora <span class="text-danger">*</span></label>
    <input type="datetime-local" class="form-control" id="scheduledDate" formControlName="scheduledDate" />
    <app-field-error [control]="form.get('scheduledDate')" />
  </div>
  <div class="mb-3">
    <label for="duration" class="form-label">Duração <span class="text-danger">*</span></label>
    <input type="time" class="form-control" id="duration" formControlName="duration" placeholder="00:00" />
    <app-field-error [control]="form.get('duration')" />
  </div>
  <div class="mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive" />
      <label class="form-check-label" for="isActive">Ativo</label>
    </div>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
