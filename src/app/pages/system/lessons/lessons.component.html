<section class="page-section">
  <div class="page-toolbar">
    <p-button label="Nova Aula" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="items()?.items ?? []" [loading]="isLoading()"
           styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{'min-width': '50rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>Título</th>
        <th>Descrição</th>
        <th>Início</th>
        <th>Duração</th>
        <th>Status</th>
        <th class="text-center" style="width:8rem">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-lesson>
      <tr>
        <td>{{ lesson.title }}</td>
        <td>{{ lesson.description }}</td>
        <td>{{ lesson.scheduledDate | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ lesson.duration }}</td>
        <td>
          <p-tag [value]="lesson.isActive ? 'Ativa' : 'Inativa'"
                 [severity]="lesson.isActive ? 'success' : 'danger'" />
        </td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" severity="info" size="small" (onClick)="openEdit(lesson)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="delete(lesson)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td [colSpan]="6" class="text-center py-5 text-muted">Nenhum registro.</td></tr>
    </ng-template>
  </p-table>

  <app-pagination [currentPage]="currentPage()" [totalPages]="items()?.totalPages ?? 1"
    [pageSize]="pageSize()" [totalItems]="items()?.totalCount ?? 0"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" />

  <p-dialog [visible]="openedCreate()" (visibleChange)="openedCreate.set($event)"
    header="Nova Aula" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-30rem">
    <app-create-lesson (closeEvent)="openedCreate.set(false)" (lessonCreated)="onCreated()" />
  </p-dialog>

  <p-dialog [visible]="openedUpdate()" (visibleChange)="openedUpdate.set($event)"
    header="Editar Aula" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full md:w-30rem">
    @if (selected()) {
      <app-update-lesson [lesson]="selected()!" (closeEvent)="openedUpdate.set(false)" (lessonUpdated)="onUpdated()" />
    }
  </p-dialog>
</section>
