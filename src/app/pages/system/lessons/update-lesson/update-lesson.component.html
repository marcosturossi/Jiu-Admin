<form [formGroup]="form" class="dialog-form">
  <div class="field">
    <label for="title">Título *</label>
    <input pInputText id="title" formControlName="title" placeholder="Título da aula" class="w-full" />
  </div>
  <div class="field">
    <label for="description">Descrição</label>
    <textarea pTextarea id="description" formControlName="description"
      placeholder="Descrição da aula" rows="3" class="w-full"></textarea>
  </div>
  <div class="field">
    <label for="scheduledDate">Data e Hora *</label>
    <input pInputText type="datetime-local" id="scheduledDate" formControlName="scheduledDate" class="w-full" />
  </div>
  <div class="field">
    <label for="duration">Duração *</label>
    <input pInputText type="time" id="duration" formControlName="duration" placeholder="00:00" class="w-full" />
  </div>
  <div class="field">
    <div class="flex align-items-center gap-2">
      <p-checkbox inputId="isActive" formControlName="isActive" [binary]="true" />
      <label for="isActive">Ativo</label>
    </div>
  </div>
  <div class="dialog-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" />
  </div>
</form>
