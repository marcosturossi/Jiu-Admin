<form [formGroup]="form" (ngSubmit)="save()">
  <!-- Dados pessoais -->
  <div class="mb-3">
    <label class="form-label">Nome <span class="text-danger">*</span></label>
    <input type="text" class="form-control" formControlName="name" placeholder="Nome do fornecedor" />
  </div>

  <div class="mb-3">
    <label class="form-label">E-mail <span class="text-danger">*</span></label>
    <input type="email" class="form-control" formControlName="email" placeholder="email@exemplo.com" />
  </div>

  <div class="mb-3">
    <label class="form-label">Telefone</label>
    <input type="text" class="form-control" formControlName="phoneNumber" placeholder="(11) 99999-9999" />
  </div>

  <!-- Endereços -->
  <div class="addresses-section">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="mb-0">Endereços</h6>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="addAddress()">
        <i class="bi bi-plus-lg me-1"></i>Adicionar Endereço
      </button>
    </div>

    <div formArrayName="addresses">
      @for (addr of addresses.controls; track $index) {
        <div class="address-block" [formGroupName]="$index">
          <div class="address-block__header">
            <span class="fw-semibold">Endereço {{ $index + 1 }}</span>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeAddress($index)">
              <i class="bi bi-trash"></i>
            </button>
          </div>

          <div class="address-grid">
            <div class="mb-3">
              <label class="form-label">Tipo <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="typeAddress">
                <option value="" disabled>Selecione</option>
                @for (t of addressTypes; track t) {
                  <option [value]="t">{{ t === 'Comercial' ? 'Comercial' : 'Residencial' }}</option>
                }
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">CEP <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="zipCode" placeholder="00000-000" />
            </div>

            <div class="mb-3 col-full">
              <label class="form-label">Rua <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="street" placeholder="Nome da rua" />
            </div>

            <div class="mb-3">
              <label class="form-label">Número <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="number" placeholder="123" />
            </div>

            <div class="mb-3">
              <label class="form-label">Complemento</label>
              <input type="text" class="form-control" formControlName="complement" placeholder="Apto, sala..." />
            </div>

            <div class="mb-3">
              <label class="form-label">Bairro <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="neighborhood" placeholder="Bairro" />
            </div>

            <div class="mb-3">
              <label class="form-label">Cidade <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="city" placeholder="Cidade" />
            </div>

            <div class="mb-3">
              <label class="form-label">Estado <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="state" placeholder="SP" maxlength="2" />
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Footer -->
  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
