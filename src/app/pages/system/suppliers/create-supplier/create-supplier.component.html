<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label class="form-label">Tipo de Pessoa <span class="text-danger">*</span></label>
    <select
      class="form-select"
      formControlName="personType"
      (change)="onPersonTypeChange(form.get('personType')!.value)"
    >
      <option value="" disabled>Selecione</option>
      <option value="individual">Pessoa Física</option>
      <option value="company">Pessoa Jurídica</option>
    </select>
  </div>

  <!-- Pessoa Física -->
  @if (individualPerson) {
    <div formGroupName="individualPerson">
      <div class="row">
        <div class="mb-3 col-6">
          <label class="form-label">Nome <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="firstName" placeholder="Nome" />
        </div>

        <div class="mb-3 col-6">
          <label class="form-label">Sobrenome <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="lastName" placeholder="Sobrenome" />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">CPF <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="cpf" placeholder="00000000000" maxlength="11" />
      </div>

      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" formControlName="email" placeholder="email@exemplo.com" />
      </div>

      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" formControlName="phoneNumber" placeholder="(11) 99999-9999" />
      </div>
    </div>
  }

  <!-- Pessoa Jurídica -->
  @if (companyPerson) {
    <div formGroupName="companyPerson">
      <div class="mb-3">
        <label class="form-label">Razão Social <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="name" placeholder="Nome da empresa" />
      </div>

      <div class="mb-3">
        <label class="form-label">CNPJ <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="cnpj" placeholder="00000000000000" maxlength="14" />
      </div>

      <div class="mb-3">
        <label class="form-label">Data de Fundação <span class="text-danger">*</span></label>
        <input type="date" class="form-control" formControlName="foundedIn" />
      </div>

      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" formControlName="email" placeholder="email@exemplo.com" />
      </div>

      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" formControlName="phoneNumber" placeholder="(11) 99999-9999" />
      </div>
    </div>
  }

  <!-- Endereços -->
  <div class="addresses-section">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="mb-0">Endereços</h6>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="addAddress()">
        <i class="bi bi-plus-lg me-1"></i>Adicionar Endereço
      </button>
    </div>

    @for (addr of addresses.controls; track $index) {
      <app-address-form [group]="$any(addr)" [index]="$index" (remove)="removeAddress($index)" />
    }
  </div>

  <!-- Footer -->
  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
