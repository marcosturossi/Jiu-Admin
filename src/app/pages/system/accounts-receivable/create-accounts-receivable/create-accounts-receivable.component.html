<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label for="type">Tipo <span class="text-danger">*</span></label>
    <select class="form-select" id="type" formControlName="type">
      <option value="" disabled>Selecione</option>
      @for (opt of typeOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <app-field-error [control]="form.get('type')" />
  </div>

  <div class="mb-3">
    <label for="studentSelect">Aluno <span class="text-danger">*</span></label>
    <app-search-select
      inputId="studentSelect"
      [options]="studentOptions()"
      [selected]="selectedStudent()"
      placeholder="Selecione o aluno"
      label="Aluno"
      (selectionChange)="onStudentSelected($event)"
      (searchChange)="onStudentSearch($event)" />
    <app-field-error [control]="form.get('personId')" />
  </div>

  <div class="mb-3">
    <label for="category">Categoria</label>
    <div class="d-flex gap-2">
      <div class="flex-grow-1">
        <app-search-select
          inputId="category"
          [options]="categoryOptions()"
          [selected]="selectedCategory()"
          placeholder="Sem categoria"
          label="Categoria"
          (selectionChange)="onCategorySelected($event)"
          (searchChange)="onCategorySearch($event)" />
      </div>
      <button type="button" class="btn btn-outline-secondary" title="Nova categoria" (click)="openedCreateCategory.set(true)">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
  </div>

  <div class="mb-3">
    <label for="description">Descrição</label>
    <input type="text" class="form-control" id="description" formControlName="description" placeholder="Opcional" />
  </div>

  <div class="mb-3">
    <label for="amount">Valor <span class="text-danger">*</span></label>
    <input type="number" class="form-control" id="amount" formControlName="amount" step="0.01" min="0.01" />
    <app-field-error [control]="form.get('amount')" />
  </div>

  <div class="mb-3">
    <label for="transactionDate">Data <span class="text-danger">*</span></label>
    <input type="date" class="form-control" id="transactionDate" formControlName="transactionDate" />
    <app-field-error [control]="form.get('transactionDate')" />
  </div>

  <div class="mb-3">
    <label for="dueDate">Vencimento <span class="text-danger">*</span></label>
    <input type="date" class="form-control" id="dueDate" formControlName="dueDate" />
    <app-field-error [control]="form.get('dueDate')" />
  </div>

  <div class="mb-3">
    <label for="reference">Referência</label>
    <input type="text" class="form-control" id="reference" formControlName="reference" placeholder="Opcional" />
  </div>

  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>

@if (openedCreateCategory()) {
  <div class="modal-backdrop-custom" (click)="openedCreateCategory.set(false)"></div>
  <div class="modal show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nova Categoria</h5>
          <button type="button" class="btn-close" (click)="openedCreateCategory.set(false)" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <app-create-transaction-category
            (closeEvent)="openedCreateCategory.set(false)"
            (categoryCreated)="onCategoryCreated($event)" />
        </div>
      </div>
    </div>
  </div>
}
