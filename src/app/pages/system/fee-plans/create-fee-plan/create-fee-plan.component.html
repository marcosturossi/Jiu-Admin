<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label for="name">Nome <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="name" formControlName="name" placeholder="Ex: Plano Mensal" />
    <app-field-error [control]="form.get('name')" />
  </div>
  <div class="mb-3">
    <label for="description">Descrição</label>
    <textarea class="form-control" id="description" formControlName="description" placeholder="Descrição do plano" rows="3"></textarea>
  </div>
  <div class="mb-3">
    <label for="monthDuration">Duração (meses) <span class="text-danger">*</span></label>
    <input type="number" class="form-control" id="monthDuration" formControlName="monthDuration" min="1" />
    <app-field-error [control]="form.get('monthDuration')" />
  </div>
  <div class="mb-3">
    <label for="price">Preço <span class="text-danger">*</span></label>
    <input type="number" class="form-control" id="price" formControlName="price" step="0.01" />
    <app-field-error [control]="form.get('price')" />
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
