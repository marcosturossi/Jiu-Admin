<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label for="name">Nome *</label>
    <input type="text" class="form-control" id="name" formControlName="name" placeholder="Ex: Plano Mensal" />
  </div>
  <div class="mb-3">
    <label for="description">Descrição</label>
    <textarea class="form-control" id="description" formControlName="description" placeholder="Descrição do plano" rows="3"></textarea>
  </div>
  <div class="mb-3">
    <label for="monthDuration">Duração (meses) *</label>
    <input type="number" class="form-control" id="monthDuration" formControlName="monthDuration" min="1" />
  </div>
  <div class="mb-3">
    <label for="price">Preço *</label>
    <input type="number" class="form-control" id="price" formControlName="price" step="0.01" />
  </div>
  <div class="mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive" />
      <label class="form-check-label" for="isActive">Ativo</label>
    </div>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-lg me-1"></i>Salvar
    </button>
  </div>
</form>
