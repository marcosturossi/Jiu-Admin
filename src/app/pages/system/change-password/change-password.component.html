<section class="page-section">
  <div class="surface-card settings-card">
    <h5 class="settings-title">
      <i class="bi bi-shield-lock me-2"></i>Alterar Senha
    </h5>
    <p class="settings-subtitle">Informe sua senha atual e escolha uma nova senha para sua conta.</p>

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="currentPassword" class="form-label">Senha Atual <span class="text-danger">*</span></label>
          <input type="password" id="currentPassword" class="form-control" formControlName="currentPassword" autocomplete="current-password" />
          <app-field-error [control]="form.get('currentPassword')" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="newPassword" class="form-label">Nova Senha <span class="text-danger">*</span></label>
          <input type="password" id="newPassword" class="form-control" formControlName="newPassword" autocomplete="new-password" />
          <app-field-error [control]="form.get('newPassword')" />
        </div>

        <div class="col-md-6 mb-3">
          <label for="confirmPassword" class="form-label">Confirmar Nova Senha <span class="text-danger">*</span></label>
          <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword" autocomplete="new-password" />
          @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched) {
            <div class="invalid-feedback d-block">A confirmação não corresponde à nova senha.</div>
          } @else {
            <app-field-error [control]="form.get('confirmPassword')" />
          }
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
          @if (isSaving()) {
            <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          } @else {
            <i class="bi bi-check-lg me-1"></i>
          }
          Alterar Senha
        </button>
      </div>
    </form>
  </div>
</section>
