<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label for="name" class="form-label">Nome *</label>
    <input type="text" id="name" formControlName="name" placeholder="Ex: Mensalidade" class="form-control" />
  </div>
  <div class="mb-3">
    <div class="form-check">
      <input type="checkbox" formControlName="isActive" id="isActive" class="form-check-input" />
      <label for="isActive" class="form-check-label">Ativo</label>
    </div>
  </div>
  <div class="d-flex gap-2 justify-content-end mt-3">
    <button class="btn btn-outline-secondary" type="button" (click)="close()">Cancelar</button>
    <button class="btn btn-primary" type="submit">
      <i class="bi bi-check-lg me-1"></i> Salvar
    </button>
  </div>
</form>
