<form [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label for="paidAmount">Valor Pago <span class="text-danger">*</span></label>
    <input type="number" class="form-control" id="paidAmount" formControlName="paidAmount" step="0.01" min="0.01" />
    <app-field-error [control]="form.get('paidAmount')" />
  </div>

  <div class="mb-3">
    <label for="paidAt">Data do Pagamento <span class="text-danger">*</span></label>
    <input type="date" class="form-control" id="paidAt" formControlName="paidAt" />
    <app-field-error [control]="form.get('paidAt')" />
  </div>

  <div class="mb-3">
    <label for="notes">Notas</label>
    <input type="text" class="form-control" id="notes" formControlName="notes" placeholder="Opcional" />
  </div>

  <div class="d-flex gap-2 justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving() || form.invalid">
      @if (isSaving()) { <span class="spinner-border spinner-border-sm me-1" role="status"></span> }
      <i class="bi bi-check-lg me-1"></i>Confirmar Pagamento
    </button>
  </div>
</form>
