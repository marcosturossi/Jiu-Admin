@if (safeBlobUrl) {
  @if (isImage) {
    <img [src]="safeBlobUrl" alt="Image preview" style="max-width: 100%; max-height: 80vh;" />
  }
  @if (isPdf) {
    <object [data]="safeBlobUrl" type="application/pdf" width="100%" height="600px">
      <iframe [src]="safeBlobUrl" width="100%" height="600px">
        <p>Your browser does not support PDFs. <a [href]="safeBlobUrl" target="_blank">Download PDF</a>.</p>
      </iframe>
    </object>
  }
  @if (!isImage && !isPdf) {
    <a [href]="safeBlobUrl" download>Download file</a>
  }
}
@if (!safeBlobUrl) {
  <p>No file to display.</p>
}
