<header class="app-navbar">
  <div class="navbar-start">
    <button
      class="btn btn-link navbar-toggle p-0"
      (click)="toggleSidebar()"
      [attr.aria-label]="sidebarExpanded() ? 'Fechar menu' : 'Abrir menu'"
      title="Toggle sidebar"
    >
      <i [class]="sidebarExpanded() ? 'bi bi-chevron-left' : 'bi bi-chevron-right'" style="font-size:1.4rem;"></i>
    </button>
    <img class="navbar-logo" src="assets/company/carlson_logo.png" alt="RX Jiu-Jitsu" />
  </div>

  <div class="navbar-end">
    <button
      class="btn btn-link navbar-theme-btn p-0"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.currentTheme() === 'light' ? 'Ativar modo escuro' : 'Ativar modo claro'"
      title="Toggle dark mode"
    >
      <i [class]="themeService.currentTheme() === 'light' ? 'bi bi-moon' : 'bi bi-sun-fill'" style="font-size:1.2rem;"></i>
    </button>

    <div ngbDropdown class="d-inline-block">
      <button class="btn btn-link navbar-user-btn" ngbDropdownToggle>
        <i class="bi bi-person me-1"></i>{{ userName() }}
      </button>
      <div ngbDropdownMenu>
        <button ngbDropdownItem (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>Sair
        </button>
      </div>
    </div>
  </div>
</header>
