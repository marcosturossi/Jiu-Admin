<header class="app-navbar">
  <div class="navbar-start">
    <p-button
      [icon]="sidebarOpen() ? 'pi pi-times' : 'pi pi-bars'"
      [text]="true"
      severity="secondary"
      styleClass="navbar-toggle"
      (onClick)="toggleSidebar()"
      aria-label="Toggle menu"
    />
    <img class="navbar-logo" src="assets/company/carlson_logo.png" alt="Carlson Gracie" />
  </div>

  <div class="navbar-end">
    <p-menu #menu [model]="userMenuItems" [popup]="true" />
    <p-button
      [label]="userName()"
      icon="pi pi-user"
      [text]="true"
      severity="secondary"
      styleClass="navbar-user-btn"
      (onClick)="menu.toggle($event)"
    />
  </div>
</header>
