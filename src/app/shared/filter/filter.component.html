<div class="filter-panel">
  <div class="filter-row">
    <p-select
      [options]="keyOptions()"
      [ngModel]="selectedFilterKey()"
      (ngModelChange)="selectedFilterKey.set($event)"
      placeholder="Campo"
      styleClass="w-full"
    />
    <p-select
      [options]="operationOptions"
      [ngModel]="selectedOperation()"
      (ngModelChange)="selectedOperation.set($event)"
      placeholder="Operação"
      styleClass="w-full"
    />
    <input
      pInputText
      type="text"
      [ngModel]="value()"
      (ngModelChange)="value.set($event)"
      placeholder="Valor"
      class="w-full"
    />
  </div>
  <div class="filter-actions">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Filtrar" icon="pi pi-filter" (onClick)="save()" />
  </div>
</div>
