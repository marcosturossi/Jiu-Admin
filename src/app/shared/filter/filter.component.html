<div class="filter-panel">
  <div class="filter-row">
    <select
      class="form-select"
      [ngModel]="selectedFilterKey()"
      (ngModelChange)="selectedFilterKey.set($event)"
    >
      <option value="" disabled>Campo</option>
      @for (key of filterKeys(); track key) {
        <option [value]="key">{{ key }}</option>
      }
    </select>
    <select
      class="form-select"
      [ngModel]="selectedOperation()"
      (ngModelChange)="selectedOperation.set($event)"
    >
      @for (op of operations; track op) {
        <option [value]="op">{{ op }}</option>
      }
    </select>
    <input
      type="text"
      class="form-control"
      [ngModel]="value()"
      (ngModelChange)="value.set($event)"
      placeholder="Valor"
    />
  </div>
  <div class="filter-actions">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()">
      <i class="bi bi-funnel me-1"></i>Filtrar
    </button>
  </div>
</div>
