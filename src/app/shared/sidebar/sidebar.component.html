<nav class="sidebar" [class.expanded]="sidebarExpanded()">
  <nav class="sidebar-nav">
    @for (section of sections; track section.title) {
      <div class="sidebar-section">
        @if (sidebarExpanded()) {
          <span class="sidebar-section-title">{{ section.title }}</span>
        }
        @for (item of section.items; track item.route) {
          <a
            class="sidebar-link"
            [class.active]="isActive(item.route)"
            (click)="navigate(item.route)"
            [attr.title]="!sidebarExpanded() ? item.label : null"
            role="button"
            tabindex="0"
            (keydown.enter)="navigate(item.route)"
          >
            <i [class]="item.icon" class="sidebar-icon"></i>
            @if (sidebarExpanded()) {
              <span class="sidebar-label">{{ item.label }}</span>
            }
          </a>
        }
      </div>
    }
  </nav>
</nav>
