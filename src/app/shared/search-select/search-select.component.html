<button
  type="button"
  [attr.id]="inputId()"
  class="form-select text-start search-select-trigger"
  [class.disabled]="disabled()"
  [attr.disabled]="disabled() ? true : null"
  (click)="open()">
  @if (selected()) {
    {{ selected()!.label }}
  } @else {
    <span class="text-muted">{{ placeholder() }}</span>
  }
</button>

@if (isOpen()) {
  <div class="modal-backdrop fade show" (click)="close()"></div>
  <div class="modal show d-block" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ label() }}</h5>
          <button type="button" class="btn-close" (click)="close()" aria-label="Fechar"></button>
        </div>
        <div class="modal-body p-0">
          <div class="p-3 border-bottom">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input
                type="text"
                class="form-control"
                placeholder="Buscar..."
                [value]="query()"
                (input)="onQueryInput($any($event.target).value)"
                autofocus />
            </div>
          </div>
          <ul class="list-group list-group-flush search-select-list">
            @if (selected()) {
              <li
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center search-select-clear"
                (click)="clear(); close()">
                <span>Limpar seleção</span>
                <i class="bi bi-x-lg"></i>
              </li>
            }
            @if (filteredOptions().length === 0) {
              <li class="list-group-item text-center text-muted py-4">
                Nenhum resultado encontrado.
              </li>
            }
            @for (opt of filteredOptions(); track opt.id) {
              <li
                class="list-group-item list-group-item-action"
                [class.active]="selected()?.id === opt.id"
                (click)="select(opt)">
                {{ opt.label }}
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </div>
}
