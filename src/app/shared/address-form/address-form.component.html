<div class="address-block" [formGroup]="group()">
  <div class="address-block__header">
    <span class="fw-semibold">Endereço {{ index() + 1 }}</span>
    <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove.emit()">
      <i class="bi bi-trash"></i>
    </button>
  </div>

  <div class="address-grid">
    <div class="mb-3">
      <label class="form-label">Tipo <span class="text-danger">*</span></label>
      <select class="form-select" formControlName="typeAddress">
        <option value="" disabled>Selecione</option>
        @for (t of addressTypes; track t) {
          <option [value]="t">{{ t === 'Comercial' ? 'Comercial' : 'Residencial' }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">CEP <span class="text-danger">*</span></label>
      <input type="text" class="form-control" formControlName="zipCode" placeholder="00000-000" (blur)="onZipCodeChange()" />
    </div>

    <div class="mb-3 col-full">
      <label class="form-label">Rua <span class="text-danger">*</span></label>
      <input type="text" class="form-control" formControlName="street" placeholder="Nome da rua" />
    </div>

    <div class="mb-3">
      <label class="form-label">Número <span class="text-danger">*</span></label>
      <input type="text" class="form-control" formControlName="number" placeholder="123" />
    </div>

    <div class="mb-3">
      <label class="form-label">Complemento</label>
      <input type="text" class="form-control" formControlName="complement" placeholder="Apto, sala..." />
    </div>

    <div class="mb-3">
      <label class="form-label">Bairro <span class="text-danger">*</span></label>
      <input type="text" class="form-control" formControlName="neighborhood" placeholder="Bairro" />
    </div>

    <div class="mb-3">
      <label class="form-label">Cidade <span class="text-danger">*</span></label>
      <input type="text" class="form-control" formControlName="city" placeholder="Cidade" />
    </div>

    <div class="mb-3">
      <label class="form-label">Estado <span class="text-danger">*</span></label>
      <input type="text" class="form-control" formControlName="state" placeholder="SP" maxlength="2" />
    </div>
  </div>
</div>
