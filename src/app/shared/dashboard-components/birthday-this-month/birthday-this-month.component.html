<div class="dashboard-card">
  <div class="card-header text-center">Aniversários este mês</div>
  <div class="card-body">
    @if (loading()) {
      <div class="text-center py-3 text-muted">Carregando...</div>
    } @else if (error()) {
      <div class="text-danger text-center py-2">{{ error() }}</div>
    } @else if (birthdays().length > 0) {
      <ul class="birthday-list">
        @for (b of birthdays(); track b.studentName) {
          <li class="birthday-item">
            <span class="name">{{ b.studentName ?? '-' }}</span>
            <span class="date">{{ b.birthDate | date:'dd/MM' }}</span>
          </li>
        }
      </ul>
    } @else {
      <div class="text-center text-muted py-3">Sem aniversários este mês</div>
    }
  </div>
</div>
